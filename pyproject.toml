[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "forktape"
version = "0.1.0"
description = "Deterministic time-travel forking, dual-protocol (LLM SSE + MCP) flight recording, and LangGraph counterfactual root-cause biopsy for AI Agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "soulboy06" }
]
keywords = [
    "ai-agents",
    "mcp",
    "model-context-protocol",
    "llm-debugging",
    "time-travel-debugging",
    "langgraph",
    "vcr",
    "evals",
    "context-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "rank-bm25>=0.2.2",
    "jinja2>=3.1.4",
    "langgraph>=0.2.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
forktape = "forktape.cli:app"
ftk = "forktape.cli:app"

[project.urls]
Homepage = "https://github.com/soulboy06/forktape"
Repository = "https://github.com/soulboy06/forktape"
Issues = "https://github.com/soulboy06/forktape/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/forktape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

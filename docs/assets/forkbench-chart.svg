<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="100%" height="100%" role="img" aria-label="ForkBench-50 Benchmark Results">
  <defs>
    <linearGradient id="bgBench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="980" height="410" rx="16" fill="url(#bgBench)" stroke="#1e293b" stroke-width="2"/>

  <text x="34" y="42" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">
    FORKBENCH-50 BENCHMARK — Counterfactual Biopsy vs. Naive Tail-Log Inspection
  </text>
  <text x="34" y="64" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">
    Evaluated on 50 multi-step failure trajectories (40 single-fault + 10 compound adversarial multi-fault runs, 5–10 steps/run)
  </text>

  <!-- Legend -->
  <rect x="650" y="30" width="14" height="14" rx="3" fill="#475569"/>
  <text x="670" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Naive Tail Baseline</text>
  <rect x="805" y="30" width="14" height="14" rx="3" fill="url(#barEmerald)"/>
  <text x="825" y="42" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ForkTape Biopsy Doctor</text>

  <!-- Left Chart Panel -->
  <g transform="translate(34, 92)">
    <rect width="585" height="284" rx="12" fill="#111827" stroke="#1e293b"/>

    <!-- Metric 1 -->
    <text x="20" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Exact Drift-Step Localization Accuracy</text>
    <rect x="20" y="46" width="6" height="16" rx="3" fill="#475569"/>
    <text x="34" y="58" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">0.0% (Always blames final crash step)</text>
    <rect x="20" y="68" width="480" height="20" rx="4" fill="url(#barCyan)"/>
    <text x="510" y="83" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="800">100.0%</text>

    <!-- Metric 2 -->
    <text x="20" y="122" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Root-Cause Classification Accuracy</text>
    <rect x="20" y="132" width="105" height="16" rx="3" fill="#475569"/>
    <text x="133" y="144" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">22.0%</text>
    <rect x="20" y="154" width="480" height="20" rx="4" fill="url(#barEmerald)"/>
    <text x="510" y="169" fill="#34d399" font-family="ui-monospace, monospace" font-size="13" font-weight="800">100.0%</text>

    <!-- Metric 3 -->
    <text x="20" y="208" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Empirical Counterfactual Fix Verification</text>
    <rect x="20" y="218" width="6" height="16" rx="3" fill="#475569"/>
    <text x="34" y="230" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">0.0% (Log viewers cannot execute ablations)</text>
    <rect x="20" y="240" width="480" height="20" rx="4" fill="url(#barEmerald)"/>
    <text x="510" y="255" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="13" font-weight="800">100.0%</text>
  </g>

  <!-- Right KPI Cards -->
  <g transform="translate(638, 92)">
    <rect width="308" height="86" rx="12" fill="#111827" stroke="#0ea5e9" stroke-width="1.4"/>
    <text x="20" y="30" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">DEBUGGING TOKEN COST REDUCTION</text>
    <text x="20" y="60" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="26" font-weight="800">-88.94%</text>
    <text x="152" y="58" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">374.7k → 41.5k tok</text>

    <rect y="99" width="308" height="86" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.4"/>
    <text x="20" y="129" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ITERATION CYCLE SPEEDUP</text>
    <text x="20" y="159" fill="#34d399" font-family="ui-monospace, monospace" font-size="26" font-weight="800">53.7x faster</text>
    <text x="196" y="157" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">VCR Prefix Skip</text>

    <rect y="198" width="308" height="86" rx="12" fill="#111827" stroke="#8b5cf6" stroke-width="1.4"/>
    <text x="20" y="224" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PER-ARCHETYPE PRECISION</text>
    <text x="20" y="246" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="10.5">MCP Overload: 100%  |  Loop: 100%</text>
    <text x="20" y="264" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="10.5">Empty RAG: 100%     |  KV Thrash: 100%</text>
    <text x="20" y="278" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10.5">Context Middle Loss: 100% (10/10)</text>
  </g>
</svg>
